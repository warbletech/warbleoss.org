# Railway config-as-code for the warbleoss.org site service.
# https://docs.railway.com/reference/config-as-code
# Deploys come from GitHub Actions (.github/workflows/deploy.yml -> `railway up`).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Only used if the service is also connected to GitHub for auto-deploys.
watchPatterns = ["index.html", "404.html", "assets/**", "Caddyfile", "Dockerfile", "railway.toml"]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
