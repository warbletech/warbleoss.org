apiVersion: apps/v1
kind: Deployment
metadata:
  name: warbleoss-site
  namespace: warbleoss
  labels:
    app: warbleoss-site
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: warbleoss-site
  template:
    metadata:
      labels:
        app: warbleoss-site
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534   # nobody (image runs USER nobody)
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: site
          # Image tag is replaced by CI (kubectl set image) with the commit SHA.
          image: us-central1-docker.pkg.dev/green-device-505513-k4/warble/warbleoss-site:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
