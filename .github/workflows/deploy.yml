name: deploy

# CD for warbleoss.org -> GKE (same cluster/registry as warbletech/warble-core).
#  - pull_request: lint, link check, build the image and smoke it locally. No deploy.
#  - push to main / manual run: the same checks, then build + push the image to Artifact
#    Registry tagged with the commit SHA, kubectl apply k8s/, set the image, wait for the
#    rollout, then smoke-test the public URL. See DEPLOY.md for one-time setup.
#
# Needs (repo Settings -> Environments -> production, or repo-level):
#   secret   GCP_WORKLOAD_IDENTITY_PROVIDER  same value as warble-core
#   secret   GCP_SERVICE_ACCOUNT             same value as warble-core
#   variable SITE_URL                        optional, default https://warbleoss.org

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ID: green-device-505513-k4
  REGION: us-central1
  CLUSTER: warble-green-device
  CLUSTER_ZONE: us-central1-a
  AR_REPO: us-central1-docker.pkg.dev/green-device-505513-k4/warble
  IMAGE_NAME: warbleoss-site
  NAMESPACE: warbleoss
  EXPECTED_TITLE: "Warble OSS"

jobs:
  check:
    name: Lint, link check & container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Stage site files (exactly what the image serves)
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html revision.txt _site/
          cp -r assets _site/
          test -s _site/index.html && test -s _site/404.html
          grep -q "<title>${EXPECTED_TITLE}" _site/index.html
          find _site -type f | sort

      - name: Check local links resolve inside the site
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r ref; do
            [ "$ref" = "/" ] && continue
            [ -e "_site/${ref#/}" ] || { echo "::error::broken local link: $ref"; missing=1; }
          done < <(grep -hoE '(href|src)="[^"#?]+' _site/*.html | sed -E 's/^(href|src)="//' | grep -vE '^(https?:|mailto:|//|data:)' | sort -u)
          exit $missing

      - name: Build image
        run: docker build -t warbleoss-site:ci .

      - name: Smoke the container
        run: |
          set -euo pipefail
          docker run -d --name site -e PORT=9000 -p 9000:9000 warbleoss-site:ci
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:9000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:9000/healthz | grep -qx ok
          curl -fsS http://127.0.0.1:9000/ | grep -q "<title>${EXPECTED_TITLE}"
          curl -fsS -o /dev/null http://127.0.0.1:9000/assets/heron-ops-logo.jpg
          code=$(curl -s -o /tmp/nf.html -w '%{http_code}' http://127.0.0.1:9000/no-such-page)
          if [ "$code" != 404 ] || ! grep -q 'Not found' /tmp/nf.html; then echo "::error::404 page broken ($code)"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/README.md)
          [ "$code" = 404 ] || { echo "::error::non-site file is served ($code)"; exit 1; }
          echo "container smoke OK"

      - name: Container logs
        if: always()
        run: docker logs site 2>&1 | tail -n 50 || true

  deploy:
    name: Deploy to GKE (production)
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://warbleoss.org' }}
    concurrency:
      group: gke-production-warbleoss-site
      cancel-in-progress: false
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://warbleoss.org' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          # Keyless auth via Workload Identity Federation, same as warble-core.
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Stamp revision
        run: echo "${GITHUB_SHA}" > revision.txt

      - name: Build & push image
        run: |
          set -euo pipefail
          img="${AR_REPO}/${IMAGE_NAME}"
          docker build -t "${img}:${GITHUB_SHA}" -t "${img}:latest" .
          docker push --all-tags "${img}"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.CLUSTER_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      # Namespaced objects only: the deploy SA cannot create clusterroles /
      # clusterrolebindings (warble-core #235). The Namespace is applied first.
      - name: Apply manifests and roll out
        run: |
          set -euo pipefail
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml -f k8s/managed-cert.yaml -f k8s/ingress.yaml
          kubectl set image deployment/warbleoss-site \
            site=${AR_REPO}/${IMAGE_NAME}:${GITHUB_SHA} --namespace=${NAMESPACE}
          kubectl rollout status deployment/warbleoss-site --namespace=${NAMESPACE} --timeout=5m
          kubectl get deployment/warbleoss-site --namespace=${NAMESPACE} \
            -o jsonpath='image={.spec.template.spec.containers[0].image} ready={.status.readyReplicas}{"\n"}'
          kubectl get managedcertificate/warbleoss-cert ingress/warbleoss-ingress --namespace=${NAMESPACE} || true

      - name: Smoke test production
        run: |
          set -uo pipefail
          url="${SITE_URL%/}"
          rev=""
          for i in $(seq 1 30); do
            rev=$(curl -fsS --max-time 10 "$url/revision.txt?ts=$(date +%s)" 2>/dev/null | tr -d '[:space:]')
            [ "$rev" = "${GITHUB_SHA}" ] && break
            echo "waiting for ${GITHUB_SHA::7} (live: ${rev:-none}) [$i/30]"; sleep 10
          done
          if [ "$rev" != "${GITHUB_SHA}" ]; then
            # Until DNS points at warbleoss-ip and the ManagedCertificate is Active, the
            # public URL still serves the old host. Warn instead of failing the deploy.
            echo "::warning::$url is not serving ${GITHUB_SHA::7} yet (got '${rev:-none}'). Check DNS -> warbleoss-ip and 'kubectl -n warbleoss describe managedcertificate warbleoss-cert'."
            exit 0
          fi
          code=$(curl -s -o /tmp/index.html -w '%{http_code}' --max-time 15 "$url/")
          [ "$code" = 200 ] || { echo "::error::$url/ returned $code"; exit 1; }
          grep -q "<title>${EXPECTED_TITLE}" /tmp/index.html || { echo "::error::$url/ title does not contain '${EXPECTED_TITLE}'"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url/no-such-page")
          [ "$code" = 404 ] || { echo "::error::$url/no-such-page returned $code, expected 404"; exit 1; }
          echo "production smoke OK: $url serves ${GITHUB_SHA::7}"
